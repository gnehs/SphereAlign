name: Release desktop app

on:
  push:
    tags:
      - "*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version in x.y.z format
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release source
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.metadata.outputs.commit }}
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}

    steps:
      - name: Check out default branch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Check out release tag
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: refs/tags/${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Validate requested version
        id: version
        shell: bash
        env:
          REQUESTED_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if [[ ! "$REQUESTED_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Version must use the x.y.z format without a v prefix: $REQUESTED_VERSION" >&2
            exit 1
          fi
          echo "value=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"

      - name: Synchronize repository versions and finalize tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          VERSION: ${{ steps.version.outputs.value }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          git fetch origin "$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if [[ "$(git rev-parse HEAD)" != "$(git rev-parse "origin/$DEFAULT_BRANCH")" ]]; then
            echo "Release $VERSION must start from the current $DEFAULT_BRANCH HEAD." >&2
            exit 1
          fi

          original_tag=""
          if [[ "$EVENT_NAME" == "push" ]]; then
            if release_json=$(gh api "repos/$GH_REPO/releases/tags/$VERSION" 2>/dev/null); then
              if [[ "$(jq -r '.draft' <<< "$release_json")" != "true" ]]; then
                echo "Release $VERSION is already published. Refusing to move its tag." >&2
                exit 1
              fi
            fi
            original_tag=$(git rev-parse "refs/tags/$VERSION")
          elif git ls-remote --exit-code --tags origin "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Refusing to move an existing release tag." >&2
            exit 1
          fi

          pnpm version:set "$VERSION"
          pnpm version:check "$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock

          version_changed=false
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): prepare $VERSION"
            version_changed=true
          fi

          if [[ "$EVENT_NAME" == "push" && "$version_changed" == "false" ]]; then
            exit 0
          fi

          git tag --force --annotate "$VERSION" --message "Release $VERSION"

          if [[ "$EVENT_NAME" == "push" ]]; then
            git push \
              --atomic \
              --force-with-lease="refs/tags/$VERSION:$original_tag" \
              origin \
              "HEAD:refs/heads/$DEFAULT_BRANCH" \
              "refs/tags/$VERSION"
          else
            git push \
              --atomic \
              origin \
              "HEAD:refs/heads/$DEFAULT_BRANCH" \
              "refs/tags/$VERSION"
          fi

      - name: Export release metadata
        id: metadata
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  create-release:
    name: Create draft release
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.release.outputs.release-id }}

    steps:
      - name: Create or reuse draft release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          if release_json=$(gh api "repos/$GH_REPO/releases/tags/$TAG" 2>/dev/null); then
            if [[ "$(jq -r '.draft' <<< "$release_json")" != "true" ]]; then
              echo "Release $TAG is already published." >&2
              exit 1
            fi
            release_id=$(jq -r '.id' <<< "$release_json")
          else
            gh release create "$TAG" \
              --draft \
              --generate-notes \
              --title "SphereAlign $TAG" \
              --verify-tag
            release_id=$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq '.id')
          fi

          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs:
      - prepare
      - create-release
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            platform: ubuntu-24.04
            args: ""
            rust-targets: ""
          - name: Windows x86_64
            platform: windows-latest
            args: ""
            rust-targets: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin

    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.commit }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Cache Rust build output
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload bundles
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
        with:
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release-id }}
          tagName: ${{ needs.prepare.outputs.tag }}
          retryAttempts: 2
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: spherealign-[platform]-[arch]-[bundle]

  publish-release:
    name: Publish release
    needs:
      - prepare
      - create-release
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Publish draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_ID: ${{ needs.create-release.outputs.release-id }}
        run: |
          gh api \
            --method PATCH \
            "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f make_latest=true
