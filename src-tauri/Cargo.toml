[package]
name = "spherealign"
version = "0.1.0"
description = "Resumable native-fisheye OSV to COLMAP studio"
authors = ["SphereAlign contributors"]
edition = "2021"
default-run = "spherealign"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "spherealign_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
cuda = ["ort/cuda"]
coreml = ["ort/coreml"]
directml = ["ort/directml"]
xnnpack = ["ort/xnnpack"]
tensorrt = ["ort/tensorrt"]
nvrtx = ["ort/nvrtx"]
webgpu = ["ort/webgpu"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10"
ureq = { version = "3.4", default-features = false, features = ["rustls"] }
zip = { version = "8.6", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
rayon = "1.11"
ndarray = "0.17"
prost = "0.14"
telemetry-parser = { git = "https://github.com/AdrianEddy/telemetry-parser.git", rev = "77a3b810a0e0f64688a90546c5aaf24c9dba00bd" }
tauri-plugin-clipboard-manager = "2"

[target.'cfg(target_os = "macos")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "coreml"] }

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["download-binaries", "directml"] }

[target.'cfg(not(any(target_os = "macos", target_os = "windows")))'.dependencies]
ort = { version = "=2.0.0-rc.13", features = ["download-binaries"] }

[dev-dependencies]
tempfile = "3"
